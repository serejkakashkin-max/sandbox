name: TEMP Apply Sandbox MM payload

on:
  push:
    branches:
      - migration/mm-mpr-20260909

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/mm-mpr-20260909
          fetch-depth: 0

      - name: Restore prepared source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .migration_payload/part*.txt | base64 -d > /tmp/sandbox-mm-payload.zip
          echo 'd6731190c658d951108d4935566d2d18f24e64da572045fcb58291c5b748c13b  /tmp/sandbox-mm-payload.zip' | sha256sum -c -
          unzip -oq /tmp/sandbox-mm-payload.zip -d .
          test -f MM/doc_templates_MPR/os_update/template.docx
          test "$(git hash-object MM/doc_templates_MPR/os_update/template.docx)" = "7453f3b50c300961bf505cbe24a00ff63084b935"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.13"

      - name: Lock runtime
        run: uv lock

      - name: Sync exact runtime
        run: uv sync --locked

      - name: Smoke-check Sandbox
        run: uv run python scripts/smoke_check.py

      - name: Test MM MPR regression suite
        run: uv run python -m unittest discover -s MM/tests -p "test_*.py"

      - name: Test CA regression suite
        working-directory: CA
        run: |
          uv sync --extra dev
          uv run python -m pytest

      - name: Commit validated migration tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration_payload
          rm -f .github/workflows/import-mpr-template-temp.yml .github/workflows/apply-sandbox-mm-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 1
          fi
          git commit -m "Move MPR generator into Sandbox MM"
          git push origin HEAD:migration/mm-mpr-20260909
