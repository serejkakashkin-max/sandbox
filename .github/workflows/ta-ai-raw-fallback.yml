name: Apply TA AI raw fallback

on:
  push:
    branches:
      - agent/ta-ai-raw-fallback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ta-ai-raw-fallback
          fetch-depth: 0

      - name: Apply verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ta-payload/part*.txt | base64 -d > /tmp/ta-patch.tgz
          echo "1b6ef2b9f6f3a318c97576354ee1badbdc21dfc3b6b713f2cd6233704660d648  /tmp/ta-patch.tgz" | sha256sum -c -
          tar -xzf /tmp/ta-patch.tgz
          rm -rf .ta-payload
          rm -f .github/workflows/ta-ai-raw-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply TA AI raw fallback"
          git push origin HEAD:agent/ta-ai-raw-fallback
