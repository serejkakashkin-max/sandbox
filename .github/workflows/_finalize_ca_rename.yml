name: Finalize CA rename bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_finalize_ca_rename.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.13"

      - name: Update CA path documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ("README.md", "CA/README.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("CA - Частухин Александр/", "CA/")
              text = text.replace('cd "CA - Частухин Александр"', "cd CA")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate runtime
        run: |
          uv sync --locked
          uv run python scripts/smoke_check.py

      - name: Commit documentation
        shell: bash
        run: |
          if git diff --quiet -- README.md CA/README.md; then
            echo "Documentation is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md CA/README.md
            git commit -m "Update CA directory documentation"
            git push
          fi

      - name: Build transfer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path("sandbox_CA_rename_patch.zip")
          instruction = """CA directory rename patch\n\n1. Stop Sandbox.\n2. Extract this archive into the root of the existing sandbox directory, preserving paths and replacing files.\n3. Delete the OLD directory: CA - Частухин Александр\n4. Keep the NEW directory: CA\n5. Run: uv sync --locked\n6. Run: uv run python scripts/smoke_check.py\n7. Start: uv run python app.py\n\nExternal URLs do not change. CA remains mounted at /ca/zpi-assistant/.\n"""

          files = [Path("wsgi.py"), Path("scripts/smoke_check.py"), Path("README.md")]
          files.extend(path for path in Path("CA").rglob("*") if path.is_file())

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in files:
                  archive.write(path, arcname=path.as_posix())
              archive.writestr("_TRANSFER_INSTRUCTIONS.txt", instruction)

          print(f"Packed {len(files)} repository files plus instructions into {output}")
          PY

      - name: Upload transfer patch
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-ca-rename-patch
          path: sandbox_CA_rename_patch.zip
          if-no-files-found: error
          retention-days: 7
