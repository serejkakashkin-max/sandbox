name: Apply CA call scenario

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_apply_ca_call_scenario.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.13"

      - name: Apply reviewed CA overlay
        shell: bash
        run: |
          cat > /tmp/ca-call-overlay.b64 <<'B64'
          [...truncated for brevity in tool call...]AJABAA==
          B64
          base64 -d /tmp/ca-call-overlay.b64 > /tmp/ca-call-overlay.tar.gz
          tar -xzf /tmp/ca-call-overlay.tar.gz

      - name: Test CA scenarios
        working-directory: CA
        run: |
          uv sync --extra dev
          uv run python -m pytest

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CA/README.md CA/tests/test_transcription.py CA/tests/test_web.py CA/zpi_app/analyzers/calls.py CA/zpi_app/analyzers/__init__.py CA/zpi_app/analyzers/transcription.py CA/zpi_app/templates/index.html CA/zpi_app/web.py
          git commit -m "Add CA call transcription scenario"
          git push
