name: Verify CA call scenario

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_apply_ca_call_scenario.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.13"

      - name: Sync Sandbox runtime
        run: uv sync --locked

      - name: Smoke-check Sandbox
        run: uv run python scripts/smoke_check.py

      - name: Test all CA scenarios
        working-directory: CA
        run: |
          uv sync --extra dev
          uv run python -m pytest

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply_ca_call_scenario.yml
          git commit -m "Verify CA call scenario integration"
          git push
