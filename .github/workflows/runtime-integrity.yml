name: Sandbox runtime integrity

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - TA/requirements-extra.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.13"

      - name: Regenerate lock
        run: uv lock

      - name: Sync exact runtime
        run: uv sync --locked

      - name: Smoke-check all Sandbox modules
        run: uv run python scripts/smoke_check.py

      - name: Persist updated lock
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Lock Sandbox runtime dependencies"
          git push
