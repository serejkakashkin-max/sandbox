[project]
name = "sandbox"
version = "0.1.0"
description = "Standalone Sandbox WSGI application hosting TA, GD and CA tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.11,<4",
    "Flask>=3.0,<4",
    "gigachat==0.1.42.post2",
    "httpcore==1.0.9",
    "httpx==0.27.2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pymorphy3==2.0.6",
    "pyspellchecker==0.9.0",
    "requests>=2.32,<3",
    "tzdata>=2025.2",
    "urllib3>=2.2,<3",
    "waitress>=3.0,<4",
]
