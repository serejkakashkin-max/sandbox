[project]
name = "sandbox"
version = "0.1.0"
description = "Standalone Sandbox WSGI application with TA incident auditor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "waitress>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
