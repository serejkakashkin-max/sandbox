<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Контроль инцидентов{% endblock %}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="app-shell {% block page_class %}{% endblock %}">
    <header class="app-header">
        <nav class="app-header__nav" aria-label="Основная навигация">
            <a class="app-brand" href="{{ url_for('index') }}" aria-label="Контроль инцидентов — на главную">
                <span class="app-brand__mark" aria-hidden="true">CI</span>
                <span>
                    <span class="app-brand__title">Контроль инцидентов</span>
                    <span class="app-brand__subtitle">Аудит качества закрытия</span>
                </span>
            </a>
            <div class="app-header__links">
                <a href="{{ url_for('index') }}">Инциденты</a>
                <a href="{{ url_for('protocols_history') }}">Протоколы</a>
            </div>
        </nav>
    </header>
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ai-analysis.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
